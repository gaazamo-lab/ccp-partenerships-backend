services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partner_crm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: &env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/partner_crm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment: *env
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: .
    command: ["celery", "-A", "celery_app.celery", "worker", "--concurrency=4", "--loglevel=info"]
    env_file: .env
    environment: *env
    depends_on: [api]

  # Separate service so the schedule runs once, not once per worker replica.
  beat:
    build: .
    command: ["celery", "-A", "celery_app.celery", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file: .env
    environment: *env
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
